services:
  postgres:
    image: postgres:17-alpine
    container_name: handsfree-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - handsfree_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: handsfree-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: ${SERVER_PORT}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      UPLOAD_DIR: /app/uploads/jobs
      PUBLIC_BASE_URL: http://localhost:${SERVER_PORT:-8080}/uploads/jobs
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-5242880}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-handsfree}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - handsfree_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  handsfree_postgres_data:
  handsfree_uploads:
