spring:
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:./BE/.env[.properties]"

  application:
    name: hands-free-be

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/handsfree}
    username: ${DB_USERNAME:handsfree}
    password: ${DB_PASSWORD:handsfree_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:100MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:130MB}

  mvc:
    async:
      request-timeout: 300000

  web:
    error:
      include-message: never


server:
  port: ${PORT:${SERVER_PORT:8080}}


app:
  identity:
    enabled: ${IDENTITY_ENABLED:false}
    api-key: ${FPT_EKYC_API_KEY:}
    encryption-key: ${IDENTITY_ENCRYPTION_KEY:}
    ocr-url: ${FPT_EKYC_OCR_URL:https://api.fpt.ai/vision/idr/vnm/}
    liveness-url: ${FPT_EKYC_LIVENESS_URL:https://api.fpt.ai/dmp/liveness/v3}
    face-match-url: ${FPT_EKYC_FACE_MATCH_URL:https://api.fpt.ai/dmp/checkface/v1/}
    min-similarity: ${FPT_EKYC_MIN_SIMILARITY:80}

  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:hands-free-api}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}

  google:
    client-ids: ${GOOGLE_CLIENT_IDS:${GOOGLE_CLIENT_ID:}}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  storage:
    provider: ${STORAGE_PROVIDER:local}
    upload-dir: ${UPLOAD_DIR:./uploads/jobs}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080/uploads/jobs}
    max-image-bytes: ${MAX_IMAGE_BYTES:5242880}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:handsfree}

  payos:
    enabled: ${PAYOS_ENABLED:false}
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    return-url: ${PAYOS_RETURN_URL:}
    cancel-url: ${PAYOS_CANCEL_URL:}

  operator-bootstrap:
    enabled: ${OPERATOR_BOOTSTRAP_ENABLED:true}

  business:
    time-zone: ${BUSINESS_TIME_ZONE:Asia/Ho_Chi_Minh}


springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs


management:
  endpoints:
    mvc:
    async:
      request-timeout: 300000

  web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never